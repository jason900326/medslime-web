name: 國考圖片題批次處理

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 執行模式
        required: true
        default: test
        type: choice
        options:
          - test
          - all
      question_id:
        description: 指定資料庫 question id（留空則依 mode 批次跑；初次測試可填 9147）
        required: false
        type: string
      limit:
        description: test 模式最多處理幾題
        required: true
        default: "10"
        type: string
      force:
        description: 已有 image_url 也重新產生
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  render-question-images:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SUPABASE_URL: https://wezcuwvjwpyylkpdjwqd.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install renderer dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "PyMuPDF>=1.24,<2" "Pillow>=10,<13" "requests>=2.31,<3"

      - name: Check required secret
        shell: bash
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::缺少 GitHub Actions secret：SUPABASE_SERVICE_ROLE_KEY"
            echo "請到 Repo Settings → Secrets and variables → Actions 新增。"
            exit 1
          fi

      - name: Render and upload official question images
        shell: bash
        run: |
          args=(
            --mode "${{ inputs.mode }}"
            --limit "${{ inputs.limit }}"
          )

          if [ -n "${{ inputs.question_id }}" ]; then
            args+=(--question-id "${{ inputs.question_id }}")
          fi

          if [ "${{ inputs.force }}" = "true" ]; then
            args+=(--force)
          fi

          python scripts/preprocess_official_question_images.py "${args[@]}"

      - name: Upload processing report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-question-images-report-${{ github.run_number }}
          path: artifacts/official-question-images/
          if-no-files-found: warn
          retention-days: 30
